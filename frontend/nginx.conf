server {
  listen 80;
  root /usr/share/nginx/html;

  # Client-side routes (/settings, /episodes/12, /admin) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change, so cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
